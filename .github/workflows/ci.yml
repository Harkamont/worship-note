name: Source and desktop checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install Pillow==12.1.1
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: node --experimental-strip-types --test desktop/*.test.ts
      - run: python -m unittest discover -s desktop -p "test_*.py"
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: npm run build:desktop
      - run: python scripts/package_source.py --output public-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: source-and-web-${{ matrix.os }}
          path: |
            public-source.zip
            dist/standalone
